[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coresight"
version = "0.1.0"
description = "Automated drill-core logging from core box photos (SAM 3.1 + Muse Spark + deterministic geotechnics)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AnaliZac" }]
dependencies = [
    "pydantic>=2.6",
    "numpy",
    "opencv-python-headless",
    "fastapi",
    "python-multipart",  # photo and audio uploads
    "uvicorn",
    "httpx",
    "python-dotenv",
    "meta-sam-parser>=0.1.0",  # official SAM 3.1 mask decoder (SAM License)
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coresight = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
