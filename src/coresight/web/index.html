<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoreSight</title>
<meta name="description" content="Drill core logging from a core box photo, reviewed by a geologist.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect x='2' y='3' width='16' height='3.2' rx='1.6' fill='%2316181c'/%3E%3Crect x='2' y='8.4' width='10' height='3.2' rx='1.6' fill='%239a6a12'/%3E%3Crect x='13.4' y='8.4' width='4.6' height='3.2' rx='1.6' fill='%2316181c'/%3E%3Crect x='2' y='13.8' width='6.5' height='3.2' rx='1.6' fill='%2316181c'/%3E%3Crect x='10' y='13.8' width='8' height='3.2' rx='1.6' fill='%2316181c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f8; --surface:#ffffff; --raised:#ffffff;
  --ink:#16181c; --ink-2:#50555e; --ink-3:#8a909a;
  --hair:rgba(22,24,28,.08); --hair-2:rgba(22,24,28,.14); --fill:rgba(22,24,28,.045); --fill-2:rgba(22,24,28,.08);
  --accent:#9a6a12; --accent-press:#855b0e; --accent-soft:#f7efe0; --accent-ink:#7a530c;
  --model:#6e56cf; --model-2:#d946b8; --model-soft:#f1edfd; --model-ink:#5643b0; --code:#3d434c; --code-soft:#eef0f2;
  --natural:#dc4a3f; --uncertain:#e3a325; --mechanical:#3d82c6; --marker:#e07be8;
  --ok:#2e7d59; --ok-soft:#e5f2eb; --bad:#c2392f; --bad-soft:#fcefed;
  --q-verypoor:#c2392f; --q-poor:#df8530; --q-fair:#d2ad2e; --q-good:#73a14d; --q-excellent:#2e7d59;
  --sh-1:0 1px 2px rgba(16,18,22,.05),0 0 0 1px var(--hair);
  --sh-2:0 1px 2px rgba(16,18,22,.04),0 12px 32px -12px rgba(16,18,22,.14),0 0 0 1px var(--hair);
  --sh-3:0 24px 80px -20px rgba(16,18,22,.32),0 0 0 1px var(--hair);
  --focus:0 0 0 4px rgba(154,106,18,.22);
  --bar:rgba(247,247,248,.78);
  --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111214; --surface:#18191c; --raised:#1f2024;
  --ink:#eef0f2; --ink-2:#b4b9c1; --ink-3:#80868f;
  --hair:rgba(255,255,255,.08); --hair-2:rgba(255,255,255,.14); --fill:rgba(255,255,255,.05); --fill-2:rgba(255,255,255,.09);
  --accent:#d39a3a; --accent-press:#e0aa4c; --accent-soft:rgba(211,154,58,.14); --accent-ink:#e8b964;
  --model:#9d8cf0; --model-2:#e879c9; --model-soft:rgba(157,140,240,.14); --model-ink:#b9adf6; --code:#c3c8cf; --code-soft:rgba(255,255,255,.07);
  --ok:#4fb386; --ok-soft:rgba(79,179,134,.14); --bad:#ef6b60; --bad-soft:rgba(239,107,96,.12);
  --sh-1:0 0 0 1px var(--hair); --sh-2:0 12px 32px -12px rgba(0,0,0,.6),0 0 0 1px var(--hair);
  --sh-3:0 24px 80px -20px rgba(0,0,0,.7),0 0 0 1px var(--hair-2); --bar:rgba(17,18,20,.72);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:15px/1.55 "Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);
  font-feature-settings:"tnum" 1,"ss01" 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:10px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:11px;border:0;
  background:var(--surface);box-shadow:var(--sh-1);cursor:pointer;white-space:nowrap;font-weight:500;font-size:14.5px;
  transition:background .2s,box-shadow .2s,transform .12s var(--ease-out)}
.btn:hover{background:var(--fill)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.16)}
.btn.primary:hover{background:var(--accent-press)}
.btn.plain{background:transparent;box-shadow:none;color:var(--ink-2)}
.btn.plain:hover{background:var(--fill);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13.5px;border-radius:8px}
.btn.icon{width:38px;padding:0}
.btn svg{width:16px;height:16px;flex:none}

/* top bar */
.bar{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:12px;padding:0 max(20px,calc((100vw - 1160px)/2));
  background:var(--bar);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);border-bottom:1px solid var(--hair)}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.015em;margin-right:6px}
.logo .a{fill:var(--accent)} .logo .b{fill:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 12px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--ink-2);font-weight:500;transition:background .2s}
.switch:hover{background:var(--fill);color:var(--ink)}
.switch svg{width:14px;height:14px;opacity:.7}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 9px;border-radius:99px;font-size:13.5px;font-weight:500}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ready{color:var(--accent-ink);background:var(--accent-soft)}
.pill.approved{color:var(--ok);background:var(--ok-soft)}
.pill.processing{color:var(--ink-2);background:var(--fill)}
.pill.processing::before{animation:pulse 1.2s ease-in-out infinite}
.pill.failed{color:var(--bad);background:var(--bad-soft)}
@keyframes pulse{50%{opacity:.25}}

/* page */
.page{max-width:1160px;margin:0 auto;padding:40px 20px 80px}
.hero{display:flex;align-items:flex-end;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.hero h1{margin:0;font-size:36px;line-height:1.12;font-weight:600;letter-spacing:-.025em}
.hero p{margin:6px 0 0;color:var(--ink-2);font-size:16px;max-width:62ch}
.hero .grow{min-width:0}
.check{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-weight:500;border:0;cursor:pointer;transition:filter .2s}
.check:hover{filter:brightness(.97)}
.check b{display:grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:#fff;font-size:13px;padding:0 6px}

.card{background:var(--surface);border-radius:18px;box-shadow:var(--sh-2)}
.tray-card{padding:10px}
.tray{position:relative;border-radius:12px;overflow:hidden;background:#24262a}
.tray img{display:block;width:100%;transition:filter .4s var(--ease-out)}
.tray svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .35s var(--ease-out)}
.tray.view-photo svg,.tray.view-masks svg{opacity:0;pointer-events:none}
.tray .ov-row{position:absolute;left:0;width:100%;opacity:0;transition:opacity .35s var(--ease-out);pointer-events:none}
.tray.view-masks .ov-row{opacity:1}
.tray svg .piece{cursor:pointer;transition:fill .2s,stroke .2s}
.tray svg .piece:hover{fill:rgba(240,185,85,.32)}
.tray-foot{display:flex;align-items:center;gap:10px;padding:10px 6px 4px;flex-wrap:wrap}
.tray-foot .muted{font-size:13.5px}
.seg{position:relative;display:inline-flex;background:var(--fill);border-radius:10px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:transparent;height:32px;padding:0 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:13.5px;font-weight:500;transition:color .2s}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:8px;background:var(--raised);box-shadow:0 1px 3px rgba(16,18,22,.12),0 0 0 .5px var(--hair);transition:left .3s var(--ease),width .3s var(--ease)}
.legend-dot{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13.5px}
.legend-dot i{width:14px;height:0;border-top:2.5px solid}
.legend-dot i.dash{border-top-style:dashed}

.section{display:flex;align-items:baseline;gap:12px;margin:44px 0 14px}
.section h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em}
.section p{margin:0;color:var(--ink-3);font-size:14px}

.log{padding:6px}
.run{display:grid;grid-template-columns:96px 6px minmax(140px,1fr) 64px 56px 104px minmax(0,1.6fr) 24px;align-items:center;column-gap:18px;
  width:100%;border:0;background:transparent;text-align:left;padding:0 16px;border-radius:12px;cursor:pointer;transition:background .2s}
.run+.run{margin-top:2px}
.run:hover{background:var(--fill)}
.run:active{background:var(--fill-2)}
.depth{display:flex;flex-direction:column;justify-content:space-between;align-self:stretch;padding:12px 0;font-size:14px}
.depth b{font-weight:600}.depth span{color:var(--ink-3)}
.column{align-self:stretch;margin:10px 0;border-radius:3px}
.rqd{display:flex;align-items:center;gap:12px}
.track{flex:1;height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.rqd b{width:42px;text-align:right;font-weight:600;font-size:16px}
.num{text-align:right;color:var(--ink-2)}
.cls{display:inline-flex;align-items:center;gap:7px;font-size:14px}
.cls i{width:8px;height:8px;border-radius:50%;flex:none}
.lith{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--ink-3);opacity:.6;transition:transform .2s var(--ease-out),opacity .2s}
.run:hover .chev{opacity:1;transform:translateX(2px)}
.log-head{display:grid;grid-template-columns:96px 6px minmax(140px,1fr) 64px 56px 104px minmax(0,1.6fr) 24px;column-gap:18px;padding:10px 16px 8px;color:var(--ink-3);font-size:13px}
.foot-note{margin:14px 4px 0;color:var(--ink-3);font-size:13.5px;max-width:75ch}
.muted{color:var(--ink-3)}

.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--bad-soft);color:var(--ink);margin-bottom:24px;animation:rise .35s var(--ease-out)}
.banner svg{flex:none;color:var(--bad);margin-top:2px}
.banner b{font-weight:600}
.banner p{margin:2px 0 0;color:var(--ink-2)}
.banner .btn{margin-left:auto}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}

/* empty and working states */
.empty{max-width:560px;margin:72px auto;text-align:center}
.empty h1{margin:0 0 10px;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.empty p{margin:0 auto 26px;color:var(--ink-2);font-size:16px;max-width:46ch}
.empty .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:56px;text-align:left}
.how div{padding:18px;border-radius:16px;background:var(--surface);box-shadow:var(--sh-1)}
.how b{display:block;font-weight:600;margin-bottom:4px}
.how span{color:var(--ink-2);font-size:14px}
.working{max-width:520px;margin:80px auto;text-align:center}
.ring{width:44px;height:44px;margin:0 auto 22px;border-radius:50%;border:3px solid var(--fill-2);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.working h1{margin:0 0 8px;font-size:27px;font-weight:600;letter-spacing:-.02em}
.working p{margin:0 0 26px;color:var(--ink-2)}
.steps{list-style:none;margin:0 auto;padding:0;display:inline-flex;flex-direction:column;gap:10px;text-align:left}
.steps li{display:flex;gap:10px;align-items:center;color:var(--ink-3);transition:color .3s}
.steps li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fill-2);transition:background .3s}
.steps li.on{color:var(--ink)}.steps li.on::before{background:var(--accent);animation:pulse 1.2s infinite}
.steps li.done{color:var(--ink-2)}.steps li.done::before{background:var(--ok)}

/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(14,15,18,.22);opacity:0;pointer-events:none;transition:opacity .35s var(--ease-out)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;top:10px;right:10px;bottom:10px;width:min(500px,calc(100vw - 20px));background:var(--raised);border-radius:20px;box-shadow:var(--sh-3);
  display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .45s var(--ease);overflow:hidden}
.drawer.on{transform:none}
.d-head{padding:20px 22px 18px;border-bottom:1px solid var(--hair)}
.d-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.d-top small{color:var(--ink-3);font-size:13.5px;flex:1}
.d-head h2{margin:0 0 16px;font-size:25px;font-weight:600;letter-spacing:-.02em}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{padding:12px;border-radius:12px;background:var(--fill)}
.metric b{display:block;font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.metric span{color:var(--ink-3);font-size:13px}
.metric s{color:var(--ink-3);font-size:13px;margin-left:6px}
.metric.flash{animation:flash 1.1s var(--ease-out)}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--fill)}}
.d-sub{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--ink-3);font-size:13.5px;flex-wrap:wrap}
.d-sub .cls{color:var(--ink)}
.partial{margin-top:12px;font-size:13.5px;color:var(--ink-2);background:var(--fill);border-radius:10px;padding:8px 10px}
.d-body{flex:1;overflow:auto;padding:6px 10px 24px}
details{border-radius:14px;margin:4px 0;transition:background .2s}
details[open]{background:transparent}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 12px;cursor:pointer;border-radius:12px;font-weight:600;transition:background .2s}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--fill)}
summary .count{color:var(--ink-3);font-weight:500}
summary .sum-note{margin-left:auto;color:var(--ink-3);font-weight:400;font-size:13.5px}
summary svg{width:14px;height:14px;color:var(--ink-3);transition:transform .3s var(--ease)}
details[open] summary svg{transform:rotate(90deg)}
.sec{padding:0 12px 10px;animation:rise .3s var(--ease-out)}
.by{color:var(--ink-3);font-size:13.5px;margin:0 0 14px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:500;font-size:13.5px;margin-bottom:6px;color:var(--ink-2)}
.input{position:relative}
.input textarea{width:100%;min-height:62px;resize:none;overflow:hidden;border:0;border-radius:12px;padding:10px 44px 10px 12px;background:var(--fill);line-height:1.5;transition:background .2s,box-shadow .2s}
.input textarea:hover{background:var(--fill-2)}
.input textarea:focus{outline:none;background:var(--raised);box-shadow:var(--focus),0 0 0 1px var(--accent)}
.input textarea:disabled{color:var(--ink-2);background:var(--fill)}
.mic{position:absolute;right:7px;top:7px;width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
.mic:hover{background:var(--fill-2);color:var(--ink)}
.mic.rec{background:var(--natural);color:#fff;box-shadow:0 0 0 0 rgba(220,74,63,.5);animation:ripple 1.4s infinite}
@keyframes ripple{70%{box-shadow:0 0 0 8px rgba(220,74,63,0)}100%{box-shadow:0 0 0 0 rgba(220,74,63,0)}}
.mic.busy{cursor:progress;color:var(--accent)}
.listening{display:flex;align-items:center;gap:10px;margin:-4px 0 14px;font-size:13.5px;color:var(--ink-2);animation:rise .25s var(--ease-out)}
.wave{display:flex;gap:2px;align-items:center;height:18px}
.wave i{width:3px;border-radius:2px;background:var(--natural);height:3px;transition:height .08s}
.was{margin-top:6px;font-size:13px;color:var(--ink-3);line-height:1.45}
.was q{color:var(--ink-2);font-style:normal}
del{color:var(--ink-3)}
.save{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.save span{color:var(--ink-3);font-size:13px}
.pieces{width:100%;border-collapse:collapse;font-size:14px}
.pieces th{color:var(--ink-3);font-weight:500;text-align:left;padding:0 6px 8px;font-size:13px}
.pieces td{padding:6px;border-top:1px solid var(--hair)}
.pieces tr{transition:background .3s}
.pieces tr.hl td{background:var(--accent-soft)}
.pieces select{border:0;border-radius:8px;padding:4px 6px;background:var(--fill);font-size:13.5px;cursor:pointer}
.sw{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:8px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--hair);font-size:14px;color:var(--ink-2)}
.hist li:first-child{border-top:0}
.hist svg{width:15px;height:15px;margin-top:2px;color:var(--ink-3)}
.hist time{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}

/* menus and modals */
.menu{position:fixed;z-index:50;min-width:240px;padding:6px;border-radius:14px;background:var(--raised);box-shadow:var(--sh-3);
  opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top;pointer-events:none;transition:opacity .18s var(--ease-out),transform .22s var(--ease)}
.menu.on{opacity:1;transform:none;pointer-events:auto}
.menu h4{margin:6px 10px 4px;font-size:13px;font-weight:600;color:var(--ink-3)}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;border:0;background:transparent;text-align:left;cursor:pointer;font-size:14.5px}
.menu a:hover,.menu button:hover{background:var(--fill)}
.menu small{display:block;color:var(--ink-3);font-size:13px}
.menu .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--fill-2)}
.dot.ready{background:var(--accent)}.dot.approved{background:var(--ok)}.dot.failed{background:var(--bad)}.dot.processing{background:var(--ink-3)}
.menu hr{border:0;border-top:1px solid var(--hair);margin:6px 4px}
.menu svg{width:16px;height:16px;color:var(--ink-3);flex:none}

dialog{border:0;padding:0;border-radius:22px;background:var(--raised);color:var(--ink);box-shadow:var(--sh-3);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto}
dialog[open]{animation:pop .35s var(--ease)}
dialog::backdrop{background:rgba(14,15,18,.3);backdrop-filter:blur(3px);animation:fade .3s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes fade{from{opacity:0}}
.m-body{padding:26px 26px 22px}
.m-body h2{margin:0 0 6px;font-size:23px;font-weight:600;letter-spacing:-.02em}
.m-body > p{margin:0 0 20px;color:var(--ink-2)}
.m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
dialog.small{width:min(400px,calc(100vw - 24px))}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:16px;padding:28px;text-align:center;cursor:pointer;color:var(--ink-2);
  margin-bottom:18px;background:var(--fill);outline:1.5px dashed var(--hair-2);outline-offset:-1.5px;transition:background .2s,outline-color .2s}
.drop:hover{background:var(--fill-2)}
.drop.over{background:var(--accent-soft);outline-color:var(--accent)}
.drop b{color:var(--ink);font-weight:600}
.drop span{font-size:13.5px}
.drop img{max-height:150px;max-width:100%;border-radius:10px;box-shadow:var(--sh-1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctl{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.ctl label{font-weight:500;font-size:13.5px;color:var(--ink-2)}
.ctl input,.ctl textarea{border:0;border-radius:10px;padding:9px 12px;background:var(--fill);transition:background .2s,box-shadow .2s}
.ctl input:hover,.ctl textarea:hover{background:var(--fill-2)}
.ctl input:focus,.ctl textarea:focus{outline:none;background:var(--raised);box-shadow:var(--focus),0 0 0 1px var(--accent)}
.ctl small{color:var(--ink-3);font-size:13px}
.more{margin:2px 0 4px}
.more summary{padding:8px 0;font-weight:500;font-size:14px;color:var(--ink-2)}
.more summary:hover{background:transparent;color:var(--ink)}
.toggle{display:flex;gap:10px;align-items:center;color:var(--ink-2);font-size:14px;margin:4px 0 6px}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.form-err{color:var(--bad);font-size:14px;margin:10px 0 0}

.toast{position:fixed;left:50%;bottom:26px;z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;
  font-size:14px;font-weight:500;box-shadow:var(--sh-3);transition:opacity .25s var(--ease-out),transform .35s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* model identity: glyphs, halo, provenance chips */
.g{display:inline-grid;place-items:center;position:relative;flex:none;vertical-align:middle}
.g svg{display:block;position:relative;z-index:1}
.g.model{color:var(--model)} .g.code{color:var(--code)} .g.human{color:var(--accent)}
.g .halo{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,var(--model),var(--model-2),#f0b955,#3d82c6,var(--model));filter:blur(7px);opacity:.8;animation:spin 3s linear infinite}
.g .halo::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.g.chip{width:34px;height:34px;border-radius:11px;background:var(--fill)}
.g.chip.model{background:var(--model-soft)} .g.chip.code{background:var(--code-soft)} .g.chip.human{background:var(--accent-soft)}
.g.work svg rect,.g.work svg path{animation:breathe 1.2s ease-in-out infinite}
.g.work svg :nth-child(2){animation-delay:.15s}.g.work svg :nth-child(3){animation-delay:.3s}.g.work svg :nth-child(4){animation-delay:.45s}.g.work svg :nth-child(5){animation-delay:.6s}.g.work svg :nth-child(6){animation-delay:.75s}
@keyframes breathe{50%{opacity:.3}}
.pill .g{margin-left:-2px}.pill.processing::before{display:none}
.src{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:1px 8px 1px 5px;border-radius:99px;white-space:nowrap;line-height:1.6}
.src .g{color:inherit}
.src.code{color:var(--code);background:var(--code-soft)} .src.model{color:var(--model-ink);background:var(--model-soft)} .src.human{color:var(--accent-ink);background:var(--accent-soft)}
.field label{display:flex;align-items:center;gap:8px}.field label .src{margin-left:auto}
.metric{border:0;text-align:left;font:inherit;color:inherit;cursor:default}
button.metric{cursor:pointer;transition:background .2s,box-shadow .2s}
button.metric:hover{background:var(--fill-2)}
.metric.focus{box-shadow:0 0 0 1.5px var(--code)}
.metric .src{margin-top:6px}
.calc{margin-top:10px;padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:13.5px;animation:rise .25s var(--ease-out)}
.calc b{display:block;font-weight:600;margin-bottom:4px}
.calc .eq{font-size:16px;font-weight:500;margin:4px 0 8px}
.calc .bars{display:flex;gap:2px;height:14px;margin:8px 0}
.calc .bars i{display:block;height:100%;border-radius:2px;background:#8fd1ae;min-width:2px}
.calc .bars i.short{background:#7d838c}
.calc small{opacity:.72;font-size:12.5px;line-height:1.45;display:block}
.seen{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;margin:0 0 16px}
.seen img{width:150px;max-height:120px;object-fit:cover;object-position:left;border-radius:8px;box-shadow:var(--sh-1);background:var(--fill)}
.seen p{margin:0;color:var(--ink-2);font-size:13.5px}
.conf{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--ink-3)}
.conf .t{width:90px;height:5px;border-radius:3px;background:var(--fill-2);overflow:hidden}.conf .t i{display:block;height:100%;background:var(--model)}

/* live analysis */
.live-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.live-head .sub{margin:8px 0 0;color:var(--ink-2);font-size:16px;display:flex;align-items:center;gap:10px}
.live-head .elapsed{color:var(--ink-3);font-size:14px}
.tray-wait{aspect-ratio:2.9;display:grid;place-items:center;color:var(--ink-3);background:var(--fill);border-radius:12px}
.tray-wait div{display:flex;flex-direction:column;align-items:center;gap:14px}
.tray .ov-live{position:absolute;left:0;width:100%;pointer-events:none;animation:maskin .6s var(--ease-out) both}
@keyframes maskin{from{opacity:0;filter:saturate(2) brightness(1.4)}}
.scan{position:absolute;left:0;right:0;border-radius:6px;overflow:hidden;background:rgba(110,86,207,.12);box-shadow:inset 0 0 0 2px rgba(150,120,255,.95),0 0 36px 6px rgba(110,86,207,.6);transition:top .5s var(--ease),height .5s var(--ease)}
.scan::before{content:"";position:absolute;top:0;bottom:0;width:36%;background:linear-gradient(90deg,transparent,rgba(200,175,255,.8),rgba(217,70,184,.55),transparent);mix-blend-mode:screen;animation:sweep 1.6s var(--ease-out) infinite}
@keyframes sweep{from{left:-40%}to{left:105%}}
.dim{position:absolute;left:0;right:0;bottom:0;background:rgba(20,22,26,.42);transition:top .5s var(--ease)}
.tag{position:absolute;display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 7px;border-radius:99px;background:rgba(255,255,255,.95);color:#16181c;box-shadow:var(--sh-2);font-size:13px;font-weight:500;transition:top .5s var(--ease),opacity .3s}
.tag b{font-weight:600;color:#5643b0}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.stage{padding:16px;border-radius:16px;background:var(--surface);box-shadow:var(--sh-1);transition:box-shadow .4s var(--ease-out),opacity .4s}

.stage.working-on.code{box-shadow:0 0 0 1.5px var(--code),0 14px 40px -16px rgba(16,18,22,.25)}

.st-top small{display:block;color:var(--ink-3);font-size:13px}
.who{margin-left:auto;font-size:12.5px;font-weight:500;padding:2px 8px;border-radius:99px}
.who.model{color:var(--model-ink);background:var(--model-soft)} .who.code{color:var(--code);background:var(--code-soft)}
.st-line{color:var(--ink-2);font-size:13.5px;min-height:42px}
.prog{height:4px;border-radius:2px;background:var(--fill-2);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--model),var(--model-2));transition:width .6s var(--ease)}
.prog.code i{background:var(--code)}
.st-foot{margin-top:8px;font-size:13px;color:var(--ink-3)}
.st-foot.ok{color:var(--ok);font-weight:500}
.motto{margin:28px 4px 0;display:flex;gap:22px;flex-wrap:wrap;color:var(--ink-3);font-size:13.5px;align-items:center}
.motto span{display:inline-flex;align-items:center;gap:8px}

/* model ledger */
.ledger{padding:8px}
.lrow,.lhead{display:grid;grid-template-columns:34px minmax(150px,1fr) minmax(170px,1.6fr) 84px 96px 130px;align-items:center;gap:16px;padding:12px 14px}
.lhead{padding:10px 14px 4px;color:var(--ink-3);font-size:13px}
.lhead span:nth-child(n+4),.lrow .num{text-align:right}
.lrow+.lrow{border-top:1px solid var(--hair)}
.lrow b{font-weight:600;display:block;line-height:1.25}
.lrow small{color:var(--ink-3);font-size:13px}
.lrow .num{color:var(--ink-2);font-size:14px}
.lrow .num small{display:block}
.agree{margin:6px 14px 10px;padding:14px;border-radius:12px;background:var(--fill);display:flex;align-items:center;gap:16px}
.agree .split{height:10px;border-radius:5px;background:var(--accent);overflow:hidden;display:flex;margin:8px 0 4px}
.agree .split i{display:block;height:100%;background:var(--model);transition:width .8s var(--ease)}
.agree b{font-weight:600}
.agree small{color:var(--ink-3);font-size:13px}
@media (max-width:900px){.lrow,.lhead{grid-template-columns:34px 1fr 90px}.lrow>:nth-child(3),.lrow>:nth-child(5),.lrow>:nth-child(6),.lhead>:nth-child(3),.lhead>:nth-child(5),.lhead>:nth-child(6){display:none}.stages{grid-template-columns:1fr 1fr}}

@media (max-width:900px){
  .run,.log-head{grid-template-columns:72px 6px 1fr 52px 18px;column-gap:12px}
  .run>:nth-child(5),.run>:nth-child(6),.run>:nth-child(7),.log-head>:nth-child(5),.log-head>:nth-child(6),.log-head>:nth-child(7){display:none}
  .how{grid-template-columns:1fr}
}
@media (max-width:640px){
  .bar{gap:6px;padding:0 12px}.logo span,.bar .label{display:none}
  .page{padding:24px 16px 60px}.hero h1{font-size:27px}.row2{grid-template-columns:1fr}
  .drawer{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:88vh;transform:translateY(105%)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : "");
const QUALITY = {"very poor":"var(--q-verypoor)",poor:"var(--q-poor)",fair:"var(--q-fair)",good:"var(--q-good)",excellent:"var(--q-excellent)"};
const BREAK_COLOR = {natural:"var(--natural)",uncertain:"var(--uncertain)",possible_mechanical:"var(--uncertain)",mechanical:"var(--mechanical)"};
const BREAK_NAME = {natural:"Natural",uncertain:"Uncertain",possible_mechanical:"Possibly mechanical",mechanical:"Mechanical"};
const FIELDS = [["lithology","Lithology"],["alteration","Alteration"],["mineralization","Mineralization"],["comment","Comment"]];
const STATUS = {ready:"Under review",approved:"Approved",processing:"Analyzing",failed:"Could not be logged"};
const MODEL = {"muse-spark-1.3":"Muse Spark 1.3"};
const I = {
  mic:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5V15"/></svg>',
  edit:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/></svg>',
  warn:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="9" r="7"/><path d="M9 5.5v4M9 12.3h.01"/></svg>',
  chev:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg>',
  close:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>',
  up:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m4 10 4-4 4 4"/></svg>',
  down:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>',
  file:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 1.5h5l3 3v10H4z"/><path d="M9 1.5v3h3"/></svg>',
};

const S = {box:null, boxes:[], samples:[], run:null, piece:null, view:"pieces", pop:null, error:null, poll:null, drafts:{}, open:{description:true}};

/* model identity */
const ACTOR = {sam:"model", spark:"model", voice:"model", code:"code", cv:"code", human:"human"};
function glyph(name, size = 18, cls = null, halo = false) {
  return `<span class="g ${cls || ACTOR[name]}" style="width:${size}px;height:${size}px">${halo ? '<span class="halo"></span>' : ""}<svg width="${size}" height="${size}" aria-hidden="true"><use href="#g-${name}"/></svg></span>`;
}
const motto = () => `<div class="motto"><span>${glyph("sam", 16)}Models perceive</span><span>${glyph("code", 16)}Code calculates</span><span>${glyph("human", 16)}The geologist decides</span></div>`;
const maskImgs = (b, cls = "ov-row") => b.mask_rows.map((r) => { const [y1, y2] = b.tray.rows[r], H = b.tray.height;
  return `<img class="${cls}" data-mask="${r}" alt="" src="/api/boxes/${b.id}/masks/${r}.png" style="top:${y1 / H * 100}%;height:${(y2 - y1) / H * 100}%">`; }).join("");
const money = (usd) => (usd == null ? "Meta credits" : usd < 0.01 ? `$${usd.toFixed(4)}` : `$${usd.toFixed(2)}`);
const secs = (x) => (x == null ? "" : x < 0.001 ? "under 1 ms" : x < 1 ? `${Math.round(x * 1000)} ms` : `${x.toFixed(1)} s`);

function origin(r, key) {
  return r.log[key] === r.machine_log[key] ? `<div><span class="src code">${glyph("code", 12)}geometry.py</span></div>`
    : `<div><span class="src human">${glyph("human", 12)}after your edits</span></div>`;
}
function fieldOrigin(r, f) {
  const last = r.corrections.filter((c) => c.target === f).pop();
  if (last) return `<span class="src human">${glyph(last.source === "voice" ? "voice" : "human", 12, "human")}${last.source === "voice" ? "Dictated by you" : "Typed by you"}</span>`;
  if (f !== "comment" && r.machine_description) return `<span class="src model">${glyph("spark", 12)}Muse Spark</span>`;
  return "";
}
function workingHTML(r, which) {
  const m = r.measure, L = r.log;
  if (which === "tcr") return `<div class="calc"><b>How this TCR was calculated</b><div class="eq">${m.recovered_cm.toFixed(1)} cm ÷ ${m.run_length_cm.toFixed(1)} cm × 100 = ${L.tcr_pct.toFixed(1)}%</div>
    <small>Core recovered in this run over the run length. Piece lengths from SAM 3.1${r.corrections.length ? " and your corrections" : ""}, sum by geometry.py. No language model touches this number.</small></div>`;
  const n = m.intact_lengths_cm.length, long = m.intact_lengths_cm.filter((x) => x >= 10).length;
  return `<div class="calc"><b>How this RQD was calculated</b><div class="eq">${m.rqd_cm.toFixed(1)} cm ÷ ${m.run_length_cm.toFixed(1)} cm × 100 = ${L.rqd_pct.toFixed(1)}%</div>
    <div class="bars">${m.intact_lengths_cm.map((x) => `<i class="${x < 10 ? "short" : ""}" style="flex:${x}" title="${x.toFixed(1)} cm"></i>`).join("")}</div>
    <small>${long} of ${n} intact pieces are 10 cm or longer and count. Mechanical breaks are rejoined first. Piece lengths from SAM 3.1${r.corrections.length ? " and your corrections" : ""}, sum by geometry.py. No language model touches this number.</small></div>`;
}
function seenHTML(r) {
  if (!r.description_backend && !r.description_error) return "";
  const md = r.machine_description, c = md ? md.confidence : null;
  return `<div class="seen"><img alt="Run ${S.run + 1} as Muse Spark saw it" src="/api/boxes/${S.box.id}/runs/${S.run}/crop.jpg" onerror="this.closest('.seen').remove()">
    <div><p>What Muse Spark saw: this run's core, cut from the tray between its run blocks.</p>
    ${c != null ? `<div class="conf">Confidence<span class="t"><i style="width:${c * 100}%"></i></span>${c.toFixed(2)}</div>` : ""}
    ${r.description_seconds != null ? `<div class="conf">Answered in ${secs(r.description_seconds)}</div>` : ""}</div></div>`;
}

function ledgerHTML(b) {
  const st = Object.fromEntries(b.stages.map((s) => [s.key, s]));
  const edits = b.runs.flatMap((r, i) => r.corrections.map((c) => ({...c, run: i})));
  const removed = edits.filter((c) => c.target.startsWith("piece")).length;
  const pieces = b.runs.reduce((n, r) => n + r.pieces.length, 0);
  const breaks = b.runs.reduce((n, r) => n + Math.max(r.pieces.length - 1, 0), 0) + removed;
  const changedBreaks = new Set(edits.filter((c) => c.target.startsWith("break")).map((c) => `${c.run}/${c.target}`)).size;
  const described = b.runs.filter((r) => r.machine_description).length * 3;
  const changedFields = new Set(edits.filter((c) => ["lithology", "alteration", "mineralization"].includes(c.target)).map((c) => `${c.run}/${c.target}`)).size;
  const recalcs = edits.filter((c) => c.target.startsWith("piece") || c.target.startsWith("break")).length;
  const proposed = pieces + removed + breaks + described, changed = removed + changedBreaks + changedFields;
  const calls = (s) => (s.calls || s.cached ? `${s.calls} call${s.calls === 1 ? "" : "s"}${s.cached ? `<small>${s.cached} from cache</small>` : ""}` : "");
  const row = (icon, name, sub, did, s, cost, reviewed) => `<div class="lrow"><span class="g chip ${ACTOR[icon]}"><svg width="18" height="18" aria-hidden="true"><use href="#g-${icon}"/></svg></span>
    <div><b>${name}</b><small>${sub}</small></div><small>${esc(did)}</small><div class="num">${s ? secs(s.seconds) : ""}${s && s.actor === "model" ? `<small>${calls(s)}</small>` : ""}</div><div class="num">${cost}</div><div class="num">${reviewed}</div></div>`;
  const v = b.voice;
  return `<section class="card ledger">
    <div class="lhead"><span></span><span>Step</span><span>Did</span><span>Time</span><span>Cost</span><span>Reviewed</span></div>
    ${row("cv", "Calibration", "OpenCV, code", st.calibration.detail, st.calibration, "No cost", "")}
    ${row("sam", "SAM 3.1", "Meta Model API", st.segmentation.detail, st.segmentation, money(st.segmentation.cost_usd), `${pieces} of ${pieces + removed} pieces kept`)}
    ${row("code", "geometry.py", "Deterministic code", st.geometry.detail, st.geometry, "No cost", recalcs ? `recalculated ${recalcs}×` : "")}
    ${row("spark", esc(st.description.name), "Meta Model API", st.description.detail, st.description, money(st.description.cost_usd), described ? `${described - changedFields} of ${described} fields kept` : "")}
    ${v.dictations ? row("voice", "Voice Transcribe", "Meta Model API", `${v.dictations} dictation${v.dictations > 1 ? "s" : ""}, ${(v.audio_ms / 1000).toFixed(1)} s of audio`, {seconds: v.seconds, actor: "code"}, money(v.audio_ms / 3600000 * 0.18), "edited before saving") : ""}
    <div class="agree"><span class="g chip human"><svg width="18" height="18" aria-hidden="true"><use href="#g-human"/></svg></span><div style="flex:1">
      <b>The geologist kept ${proposed - changed} of ${proposed} values the models proposed</b>
      <div class="split"><i style="width:${proposed ? (proposed - changed) / proposed * 100 : 100}%"></i></div>
      <small>Pieces, breaks and description fields. ${changed ? `${changed} changed, each kept next to the original for evaluation.` : "Nothing changed yet."}</small></div></div>
  </section>`;
}

/* plumbing */
async function api(path, opts = {}) {
  let res;
  try { res = await fetch(path, opts); } catch { throw new Error("The server did not answer. Check the connection and retry."); }
  if (!res.ok) {
    let detail = `The server answered ${res.status}.`;
    try { const b = await res.json(); if (b.detail) detail = typeof b.detail === "string" ? b.detail : b.detail.map((d) => d.msg).join(". "); } catch {}
    throw new Error(detail);
  }
  return res.json();
}
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2400); }
function confirmBox(title, text, yes) {
  return new Promise((done) => {
    const d = $("confirm"); $("c-title").textContent = title; $("c-text").textContent = text; $("c-yes").textContent = yes;
    $("c-yes").onclick = () => { d.close(); done(true); }; $("c-no").onclick = () => { d.close(); done(false); }; d.oncancel = () => done(false);
    d.showModal();
  });
}
const banner = (msg, action = "") => `<div class="banner" role="alert">${I.warn}<div><b>${esc(msg)}</b></div>${action}</div>`;
const draftKey = (f) => `${S.box.id}/${S.run}/${f}`;
const locked = () => S.box.status !== "ready";

async function loadLists() {
  try { [S.boxes, S.samples] = await Promise.all([api("/api/boxes"), api("/api/samples")]); } catch {}
}
async function startSample(name) {

}

/* routing */
function route() {
  clearTimeout(S.poll); S.error = null; closeDrawer(true);
  const m = location.hash.match(/^#\/box\/([a-z0-9]+)/i);
  if (m) openBox(m[1]); else { S.box = null; renderHome(); }
}
addEventListener("hashchange", route);

async function openBox(id) {
  try {
    const box = await api(`/api/boxes/${id}`);
    const fresh = !S.box || S.box.id !== id || S.box.status !== box.status;
    if (!S.box || S.box.id !== id) { S.drafts = {}; S.view = "pieces"; }
    S.box = box;
    if (fresh || box.status === "processing") render();
    if (box.status === "processing") S.poll = setTimeout(() => openBox(id), 1200);
    else loadLists();
  } catch (e) { S.box = null; renderBar(); $("page").innerHTML = `<div class="empty">${banner(e.message, '<a class="btn" href="#/">Go home</a>')}</div>`; }
}

/* live analysis: the photo transforms as each model works */
const STAGE = {
  calibration: {icon:"cv", title:"Calibration", what:"Find the tray, straighten it and set the scale."},
  segmentation: {icon:"sam", title:"Segmentation", what:"Find every intact piece of core, row by row."},
  geometry: {icon:"code", title:"Geotechnics", what:"RQD, TCR and fracture frequency per run. No model involved."},
  description: {icon:"spark", title:"Description", what:"Lithology, alteration and mineralization for each run."},
};
function liveSentence(b) {
  const s = b.stages.find((x) => x.status === "working"), n = b.tray ? b.tray.rows.length : 5;
  if (!s) return [glyph("cv", 20, null, true), "Starting."];
  if (s.key === "segmentation") return [glyph("sam", 20, "model work", true), `SAM 3.1 is finding the core pieces in row ${(s.current ?? 0) + 1} of ${n}.`];
  if (s.key === "description") return [glyph("spark", 20, "model work", true), `${esc(s.name)} is describing ${esc((s.detail || "the runs").replace(/^Run/, "run"))}.`];
  if (s.key === "geometry") return [glyph("code", 20, "code work"), "geometry.py is measuring RQD, TCR and fracture frequency."];
  return [glyph("cv", 20, "code work"), "Finding the tray and its scale."];
}
function stageCard(s) {
  const m = STAGE[s.key], cls = s.status === "working" ? `working-on ${s.actor}` : s.status;
  const foot = s.status === "done" ? `<div class="st-foot ok">Done${s.seconds != null ? ` in ${secs(s.seconds)}` : ""}${s.cached && !s.calls ? ", from cache" : ""}</div>`
    : s.status === "failed" ? `<div class="st-foot" style="color:var(--bad)">Stopped</div>` : `<div class="st-foot">${s.status === "working" ? "Working" : "Waiting"}</div>`;
  return `<div class="stage ${cls}" data-stage="${s.key}" data-status="${s.status}">
    <div class="st-top"><span class="g chip ${s.actor} ${s.status === "working" ? "work" : ""}"><svg width="18" height="18" aria-hidden="true"><use href="#g-${m.icon}"/></svg></span>
      <div><b>${m.title}</b><small>${esc(s.name)}</small></div><span class="who ${s.actor}">${s.actor === "model" ? "Model" : "Code"}</span></div>
    <div class="st-line">${esc(s.detail || m.what)}</div>
    <div class="prog ${s.actor === "code" ? "code" : ""}"><i style="width:${s.progress * 100}%"></i></div>${foot}</div>`;
}
function renderWorking() {
  const b = S.box;
  if (!$("live") || $("live").dataset.box !== b.id) {
    $("page").innerHTML = `<div id="live" data-box="${b.id}">
      <div class="live-head"><div><h1>Logging ${esc(b.hole_id)}, box ${esc(b.box_number)}</h1><p class="sub" id="live-sub"></p></div><span class="elapsed" id="live-time"></span></div>
      <section class="card tray-card"><div id="live-tray"><div class="tray-wait"><div>${glyph("cv", 40, "code work")}<span>Finding the tray and its scale</span></div></div></div></section>
      <div class="stages" id="stages">${b.stages.map(stageCard).join("")}</div>
      ${motto()}</div>`;
  }
  const [g, text] = liveSentence(b);
  if ($("live-sub").dataset.text !== text) { $("live-sub").innerHTML = `${g}<span>${text}</span>`; $("live-sub").dataset.text = text; }
  $("live-time").textContent = `${Math.max(0, Math.round((Date.now() - new Date(b.created_at)) / 1000))} s so far`;
  b.stages.forEach((s) => {
    const el = document.querySelector(`[data-stage="${s.key}"]`);
    if (!el || el.dataset.status !== s.status) { el.outerHTML = stageCard(s); return; }
    el.querySelector(".st-line").textContent = s.detail || STAGE[s.key].what;

  });
  if (!b.tray) return;
  const T = b.tray, H = T.height, pct = (y) => `${y / H * 100}%`;
  if (!$("live-img")) {
    let lines = "";
    [...T.rows.map((r) => r[0]), T.rows[T.rows.length - 1][1]].forEach((y) => (lines += `<line x1="0" x2="${T.width}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.6)" stroke-width="${T.width / 900}" stroke-dasharray="${T.width / 180} ${T.width / 220}"/>`));
    $("live-tray").innerHTML = `<div class="tray"><img id="live-img" alt="The tray, straightened" src="/api/boxes/${b.id}/tray.jpg"><div id="live-masks"></div>
      <svg viewBox="0 0 ${T.width} ${T.height}" preserveAspectRatio="none">${lines}</svg><div class="scan" id="scan" hidden></div><div class="dim" id="dim"></div>
      <span class="tag" style="left:14px;top:10px">${glyph("cv", 16, "code")}<span>Tray found: ${T.rows.length} rows, ${T.px_per_cm.toFixed(1)} px per cm</span></span>
      <span class="tag" id="sam-tag" style="right:14px;opacity:0">${glyph("sam", 16, "model")}<span id="sam-tag-text"></span></span></div>`;
  }
  const have = new Set([...$("live-masks").querySelectorAll("img")].map((i) => +i.dataset.mask));
  b.mask_rows.filter((r) => !have.has(r)).forEach((r) => $("live-masks").insertAdjacentHTML("beforeend", maskImgs({...b, mask_rows:[r]}, "ov-live")));
  const seg = b.stages.find((s) => s.key === "segmentation"), working = seg.status === "working" ? (seg.current ?? 0) : null;
  const scan = $("scan"), dim = $("dim"), tag = $("sam-tag");
  if (working !== null) {
    const [y1, y2] = T.rows[working];
    scan.hidden = false; scan.style.top = pct(y1 + 2); scan.style.height = pct(y2 - y1 - 4);
    dim.style.top = working + 1 < T.rows.length ? pct(T.rows[working + 1][0]) : "100%";
  } else { scan.hidden = true; dim.style.top = seg.status === "waiting" ? pct(T.rows[0][0]) : "100%"; }
  if (seg.detail && seg.detail.includes(":") && seg.status !== "waiting") {
    const last = b.mask_rows.length ? b.mask_rows[b.mask_rows.length - 1] : 0;
    tag.style.opacity = 1; tag.style.top = `calc(${pct(T.rows[last][1])} - 38px)`;
    $("sam-tag-text").innerHTML = esc(seg.detail.split(": ")[1] || seg.detail).replace(/(\d+ pieces)/, "<b>$1</b>");
  }
}

/* box */
function summary(b) {
  const runs = b.runs, toCheck = runs.reduce((n, r) => n + r.log.uncertain_breaks, 0);
  const worst = runs.map((r) => r.log.rock_quality).sort((a, c) => Object.keys(QUALITY).indexOf(a) - Object.keys(QUALITY).indexOf(c))[0];
  const edits = runs.reduce((n, r) => n + r.corrections.length, 0);
  return {toCheck, worst, edits, text: `${runs[0].from_m.toFixed(2)} to ${runs[runs.length - 1].to_m.toFixed(2)} m in ${runs.length} run${runs.length > 1 ? "s" : ""}. ${cap(worst)} rock at worst.${edits ? ` ${edits} correction${edits > 1 ? "s" : ""} so far.` : ""}`};
}

function runRow(r, i) {
  const L = r.log, c = QUALITY[L.rock_quality], h = Math.max(76, (r.to_m - r.from_m) * 34);

function drawOverlay() {
  const b = S.box, T = b.tray, ppc = T.px_per_cm, svg = $("ov"); if (!svg) return;
  const rowH = T.rows[0][1] - T.rows[0][0], inset = rowH * .07, k = T.width / 760;
  let s = "";
  b.runs.forEach((r, ri) => r.pieces.forEach((p, pi) => {
    const [y1, y2] = T.rows[p.row], x1 = p.start_cm * ppc, x2 = p.end_cm * ppc, ya = y1 + inset, yb = y2 - inset;
    const on = ri === S.run, hl = on && pi === S.piece;
    s += `<rect class="piece" data-r="${ri}" data-p="${pi}" x="${x1 + k}" y="${ya}" width="${Math.max(x2 - x1 - 2 * k, 1)}" height="${yb - ya}" rx="${4 * k}"
      fill="${hl ? "rgba(240,185,85,.5)" : on ? "rgba(240,185,85,.22)" : "rgba(255,255,255,.04)"}" stroke="${on ? "#f0b955" : "rgba(255,255,255,.62)"}" stroke-width="${(on ? 2.4 : 1) * k}"><title>Run ${ri + 1}, piece ${pi + 1}: ${(p.end_cm - p.start_cm).toFixed(1)} cm</title></rect>`;
    if (pi < r.pieces.length - 1) s += `<line x1="${x2}" x2="${x2}" y1="${ya - inset / 2}" y2="${yb + inset / 2}" stroke="${BREAK_COLOR[p.break_after]}" stroke-width="${3 * k}" stroke-linecap="round" ${p.break_after === "mechanical" ? `stroke-dasharray="${5 * k} ${4 * k}"` : ""}/>`;
  }));
  T.markers.forEach(([row, x]) => { const [y1, y2] = T.rows[row]; s += `<rect x="${x * ppc - 3 * k}" y="${y1 + inset / 2}" width="${6 * k}" height="${y2 - y1 - inset}" rx="${3 * k}" fill="#e07be8"/>`; });
  svg.innerHTML = s;
  svg.querySelectorAll(".piece").forEach((el) => (el.onclick = () => { S.open = {...S.open, pieces:true}; openRun(+el.dataset.r, +el.dataset.p); }));
}

/* drawer */
function openRun(i, piece = null) {
  if (S.run !== i) S.pop = null;
  const switching = S.run !== null && S.run !== i;
  S.run = i; S.piece = piece; drawOverlay(); renderDrawer();
  $("drawer").classList.add("on"); $("drawer").setAttribute("aria-hidden", "false"); $("scrim").classList.add("on");
  if (!switching) setTimeout(() => $("d-close") && $("d-close").focus({preventScroll:true}), 50);
}
function closeDrawer(silent) {
  if (S.run === null && silent) return;
  S.run = null; S.piece = null;
  $("drawer").classList.remove("on"); $("drawer").setAttribute("aria-hidden", "true"); $("scrim").classList.remove("on");
  if (!silent && S.box) drawOverlay();
}
$("scrim").onclick = () => closeDrawer();

function renderDrawer(flash = []) {
  const b = S.box, r = b.runs[S.run], L = r.log, M = r.machine_log;
  const was = (k, d) => (M[k] !== L[k] ? `<s title="Before your corrections">${M[k].toFixed(d)}</s>` : "");
  const sec = (key, title, extra, body) => `<details data-sec="${key}" ${S.open[key] ? "open" : ""}><summary>${I.chev}${title}${extra}</summary><div class="sec" id="sec-${key}">${body}</div></details>`;
  $("drawer").innerHTML = `<div class="d-head">
      <div class="d-top"><small>Run ${S.run + 1} of ${b.runs.length}</small>
        <button class="btn plain icon sm" id="d-prev" aria-label="Previous run" ${S.run === 0 ? "disabled" : ""}>${I.up}</button>
        <button class="btn plain icon sm" id="d-next" aria-label="Next run" ${S.run === b.runs.length - 1 ? "disabled" : ""}>${I.down}</button>
        <button class="btn plain icon sm" id="d-close" aria-label="Close">${I.close}</button></div>
      <h2>${r.from_m.toFixed(2)} to ${r.to_m.toFixed(2)} m</h2>
      <div class="metrics">
        <button class="metric ${flash.includes("rqd_pct") ? "flash" : ""} ${S.pop === "rqd" ? "focus" : ""}" data-pop="rqd" aria-expanded="${S.pop === "rqd"}"><b>${L.rqd_pct.toFixed(1)}%</b><span>RQD</span>${was("rqd_pct", 1)}${origin(r, "rqd_pct")}</button>
        <button class="metric ${flash.includes("tcr_pct") ? "flash" : ""} ${S.pop === "tcr" ? "focus" : ""}" data-pop="tcr" aria-expanded="${S.pop === "tcr"}"><b>${L.tcr_pct.toFixed(0)}%</b><span>TCR</span>${was("tcr_pct", 0)}${origin(r, "tcr_pct")}</button>
        <div class="metric ${flash.includes("fracture_frequency_per_m") ? "flash" : ""}"><b>${L.fracture_frequency_per_m.toFixed(2)}</b><span>FF per m</span>${was("fracture_frequency_per_m", 2)}${origin(r, "fracture_frequency_per_m")}</div>
      </div>
      ${S.pop && r.measure ? workingHTML(r, S.pop) : ""}
      <div class="d-sub"><span class="cls"><i style="background:${QUALITY[L.rock_quality]}"></i>${cap(L.rock_quality)} rock</span><span>${L.natural_fractures} natural, ${L.mechanical_breaks} mechanical, ${L.uncertain_breaks} uncertain breaks</span></div>
      ${L.complete ? "" : `<div class="partial">This run continues in another box, so these numbers cover only the part in this photo.</div>`}
    </div>
    <div class="d-body">
      ${sec("description", "Description", `<span class="sum-note">${r.description_backend ? `${glyph("spark", 13, "model")} ${esc(MODEL[r.description_backend] || r.description_backend)}` : ""}</span>`, descriptionHTML(r))}
      ${sec("pieces", "Pieces", ` <span class="count">${r.pieces.length}</span><span class="sum-note">${glyph("sam", 13, "model")} SAM 3.1</span>`, piecesHTML(r))}
      ${sec("history", "History", ` <span class="count">${r.corrections.length || ""}</span>`, historyHTML(r))}
    </div>`;
  $("d-close").onclick = () => closeDrawer();
  $("drawer").querySelectorAll("[data-pop]").forEach((m) => (m.onclick = () => { S.pop = S.pop === m.dataset.pop ? null : m.dataset.pop; renderDrawer(); }));
  $("d-prev").onclick = () => openRun(S.run - 1); $("d-next").onclick = () => openRun(S.run + 1);
  $("drawer").querySelectorAll("details").forEach((d) => (d.ontoggle = () => (S.open[d.dataset.sec] = d.open)));
  bindDescription(r); bindPieces(r);
}

function descriptionHTML(r) {
  const d = r.description, md = r.machine_description;
  const value = (f) => (f === "comment" ? r.comment : d ? d[f] : "");
  return `${seenHTML(r)}${r.description_error && !d ? `<p class="by">Muse Spark did not answer for this run. Write the description here.</p>` : ""}
    ${FIELDS.map(([f, label]) => {
      const dr = S.drafts[draftKey(f)], v = dr ? dr.value : value(f), o = f === "comment" || !md ? null : md[f];
      const notes = [];
      if (o != null && o !== value(f)) notes.push(`Muse Spark wrote <del>${esc(o) || "nothing"}</del>.`);
      if (dr && dr.transcript) notes.push(`Heard: <q>${esc(dr.transcript)}</q>`);
      return `<div class="field"><label for="f-${f}">${label}${fieldOrigin(r, f)}</label><div class="input">
        <textarea id="f-${f}" data-field="${f}" rows="${f === "lithology" ? 3 : 2}" ${locked() ? "disabled" : ""} placeholder="${f === "comment" ? "Anything the next reader should know" : ""}">${esc(v)}</textarea>
        ${locked() ? "" : `<button class="mic ${voice.field === f ? (voice.busy ? "busy" : "rec") : ""}" data-mic="${f}" aria-label="Dictate ${label.toLowerCase()}" title="Dictate">${I.mic}</button>`}</div>
        ${notes.length ? `<div class="was">${notes.join(" ")}</div>` : ""}</div>
        ${voice.field === f ? `<div class="listening" aria-live="polite"><div class="wave" id="wave">${"<i></i>".repeat(26)}</div>${voice.busy ? "Transcribing with Muse Voice Transcribe" : "Listening. Tap the microphone to stop."}</div>` : ""}`;
    }).join("")}
    ${locked() ? "" : `<div class="save"><button class="btn primary" id="save">Save changes</button><span>Typing always works. Dictation is optional.</span></div>`}`;
}
function bindDescription(r) {
  const sec = $("sec-description"); if (!sec) return;
  const fit = (t) => { t.style.height = "auto"; t.style.height = `${t.scrollHeight + 2}px`; };
  sec.querySelectorAll("textarea").forEach((t) => { fit(t); requestAnimationFrame(() => fit(t)); document.fonts.ready.then(() => fit(t)); t.oninput = () => { fit(t); const k = draftKey(t.dataset.field); S.drafts[k] = {value:t.value, transcript:(S.drafts[k] || {}).transcript || null}; }; });
  sec.querySelectorAll("[data-mic]").forEach((m) => (m.onclick = () => toggleDictation(m.dataset.mic)));
  if ($("save")) $("save").onclick = () => saveDescription(r);
}
async function saveDescription(r) {
  const cur = (f) => (f === "comment" ? r.comment : r.description ? r.description[f] : "");
  const changes = FIELDS.map(([f]) => [f, S.drafts[draftKey(f)]]).filter(([f, d]) => d && d.value.trim() !== cur(f));
  if (!changes.length) return toast("Nothing changed");
  for (const [f, d] of changes) {
    if (!(await correct(`runs/${S.run}/description`, "PUT", {field:f, value:d.value, source:d.transcript ? "voice" : "typed", transcript:d.transcript}))) return;
    delete S.drafts[draftKey(f)];
  }
  renderDrawer(); toast("Changes saved");
}

function piecesHTML(r) {
  return `<p class="by">Set each break as the core shows it. A mechanical break rejoins the two pieces.</p>
    <table class="pieces"><thead><tr><th>#</th><th>Row</th><th class="num">cm</th><th>Break after</th><th></th></tr></thead><tbody>
    ${r.pieces.map((p, j) => {
      const last = j === r.pieces.length - 1;
      const sel = last ? '<span class="muted">End of run</span>' : `<span class="sw" style="background:${BREAK_COLOR[p.break_after]}"></span><select data-break="${j}" aria-label="Break after piece ${j + 1}" ${locked() ? "disabled" : ""}>
        ${Object.entries(BREAK_NAME).map(([k, v]) => `<option value="${k}" ${k === p.break_after ? "selected" : ""}>${v}</option>`).join("")}</select>`;
      return `<tr class="${j === S.piece ? "hl" : ""}" data-row="${j}"><td>${j + 1}</td><td>${p.row + 1}</td><td class="num">${(p.end_cm - p.start_cm).toFixed(1)}</td><td>${sel}</td>
        <td class="num">${locked() ? "" : `<button class="btn plain sm danger" data-remove="${j}" aria-label="Remove piece ${j + 1}">Remove</button>`}</td></tr>`;
    }).join("")}</tbody></table>
    <p class="foot-note">Remove a piece only when it is not core: a block, a chip, a label.</p>`;
}
function bindPieces(r) {
  const sec = $("sec-pieces"); if (!sec) return;
  sec.querySelectorAll("[data-break]").forEach((s) => (s.onchange = () => { S.piece = +s.dataset.break; correct(`runs/${S.run}/breaks/${s.dataset.break}`, "POST", {kind:s.value}, "Break changed. Numbers recalculated."); }));
  sec.querySelectorAll("[data-remove]").forEach((x) => (x.onclick = async () => {
    const j = +x.dataset.remove, p = r.pieces[j];
    if (await confirmBox(`Remove piece ${j + 1}?`, `${(p.end_cm - p.start_cm).toFixed(1)} cm in row ${p.row + 1}. The numbers are recalculated without it and the change stays in the history.`, "Remove"))
      { S.piece = null; correct(`runs/${S.run}/pieces/${j}`, "DELETE", null, "Piece removed. Numbers recalculated."); }
  }));
  const hl = sec.querySelector("tr.hl"); if (hl && S.open.pieces) setTimeout(() => hl.scrollIntoView({block:"center", behavior:"smooth"}), 120);
}

function historyHTML(r) {
  return r.corrections.length ? `<ol class="hist">${r.corrections.slice().reverse().map((c) => `<li>${c.source === "voice" ? I.mic : I.edit}
    <span>${esc(cap(c.target))}: <del>${esc(c.original) || "empty"}</del> to ${esc(c.corrected) || "empty"}${c.transcript ? `<br><span class="muted">Heard: “${esc(c.transcript)}”</span>` : ""}
    <time datetime="${esc(c.at)}">${new Date(c.at).toLocaleString([], {dateStyle:"medium", timeStyle:"short"})}</time></span></li>`).join("")}</ol>
    <p class="foot-note">Kept next to the value it replaced, for the evaluation and future fine-tuning.</p>`
    : `<p class="by">No corrections yet. Changes to breaks, pieces and the description appear here with the value they replaced.</p>`;
}

async function correct(path, method, body, message) {
  const before = S.box.runs[S.run].log;
  try {
    S.box = await api(`/api/boxes/${S.box.id}/${path}`, {method, headers:body ? {"Content-Type":"application/json"} : {}, body:body ? JSON.stringify(body) : undefined});
    S.error = null;
    const after = S.box.runs[S.run].log, flash = ["rqd_pct", "tcr_pct", "fracture_frequency_per_m"].filter((k) => before[k] !== after[k]);
    const keep = S.run, piece = S.piece; renderBox(); S.run = keep; S.piece = piece; drawOverlay(); renderDrawer(flash);
    if (message) toast(message);
    loadLists(); return true;
  } catch (e) { toast(e.message); return false; }
}

$("approve").onclick = async () => {
  const b = S.box;
  if (!(await confirmBox(`Approve ${b.hole_id}, box ${b.box_number}?`, "The log is locked and ready to export. Corrections stay in the history.", "Approve box"))) return;
  try { S.box = await api(`/api/boxes/${b.id}/approve`, {method:"POST"}); closeDrawer(true); render(); loadLists(); toast("Box approved"); }
  catch (e) { S.error = e.message; renderBox(); }
};

/* dictation: mono 16-bit PCM WAV at 16 kHz, as Muse Voice Transcribe expects */
const voice = {field:null, busy:false, stream:null, ctx:null, node:null, chunks:[], rate:48000};
async function toggleDictation(field) {
  if (voice.busy) return;
  if (voice.field === field) return stopDictation();
  if (voice.field) await stopDictation(true);
  if (!navigator.mediaDevices || !window.AudioContext) return toast("This browser cannot record. Type the correction instead.");
  try { voice.stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1, echoCancellation:true, noiseSuppression:true}}); }
  catch { return toast("The microphone is blocked. Allow it in the browser, or type the correction."); }
  voice.ctx = new AudioContext(); voice.rate = voice.ctx.sampleRate; voice.chunks = [];
  const src = voice.ctx.createMediaStreamSource(voice.stream);
  voice.node = voice.ctx.createScriptProcessor(4096, 1, 1);
  voice.node.onaudioprocess = (e) => {
    const x = e.inputBuffer.getChannelData(0); voice.chunks.push(new Float32Array(x));
    const w = $("wave"); if (!w) return;
    let peak = 0; for (let i = 0; i < x.length; i += 64) peak = Math.max(peak, Math.abs(x[i]));
    const bars = w.children; for (let i = bars.length - 1; i > 0; i--) bars[i].style.height = bars[i - 1].style.height;
    bars[0].style.height = `${3 + Math.min(1, peak * 3) * 15}px`;
  };
  src.connect(voice.node); voice.node.connect(voice.ctx.destination);
  voice.field = field; S.open.description = true; renderDrawer();
}
async function stopDictation(discard = false) {
  const field = voice.field;
  voice.node && voice.node.disconnect(); voice.stream && voice.stream.getTracks().forEach((t) => t.stop());
  voice.ctx && (await voice.ctx.close());
  const x = merge(voice.chunks), rate = voice.rate; voice.chunks = [];
  if (discard || x.length < rate * .4) { voice.field = null; renderDrawer(); if (!discard) toast("Too short. Hold on a little longer."); return; }
  voice.busy = true; renderDrawer();
  try {
    const form = new FormData(); form.append("audio", new Blob([wav(downsample(x, rate, 16000), 16000)], {type:"audio/wav"}), "dictation.wav"); form.append("box_id", S.box.id);
    const text = (await api("/api/transcribe", {method:"POST", body:form})).transcript.trim();
    if (text) S.drafts[draftKey(field)] = {value:text, transcript:text}; else toast("Nothing was heard. Try closer to the microphone.");
  } catch (e) { toast(e.message); }
  voice.busy = false; voice.field = null; renderDrawer();
}
function merge(c) { const o = new Float32Array(c.reduce((n, a) => n + a.length, 0)); let p = 0; for (const a of c) { o.set(a, p); p += a.length; } return o; }
function downsample(x, from, to) {
  if (from === to) return x;
  const r = from / to, o = new Float32Array(Math.floor(x.length / r));
  for (let i = 0; i < o.length; i++) { const a = Math.floor(i * r), b = Math.min(x.length, Math.floor((i + 1) * r)); let s = 0; for (let j = a; j < b; j++) s += x[j]; o[i] = s / Math.max(1, b - a); }
  return o;
}
function wav(x, rate) {
  const buf = new ArrayBuffer(44 + x.length * 2), v = new DataView(buf), str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + x.length * 2, true); str(8, "WAVE"); str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, x.length * 2, true);
  for (let i = 0; i < x.length; i++) { const s = Math.max(-1, Math.min(1, x[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return buf;
}

/* new box modal */
let photo = null;
function openNew(error = null) {
  const d = $("new-dialog"), vals = d.open ? Object.fromEntries(["hole", "boxn", "runs", "len", "tray"].map((k) => [k, $(k).value])) : null;
  d.innerHTML = `<form class="m-body" id="new-form" novalidate>
    <h2 id="new-title">Log a new box</h2><p>One photo of a core tray, taken from above with the whole tray in view.</p>
    <label class="drop" id="drop" for="photo">${photo ? `<img alt="Selected photo" src="${URL.createObjectURL(photo)}"><b>${esc(photo.name)}</b><span>Click to choose another</span>`
      : `<b>Drop the photo here or click to choose it</b><span>JPG or PNG, up to 20 MB</span>`}</label>
    <input class="sr" type="file" id="photo" accept="image/jpeg,image/png">
    <div class="row2"><div class="ctl"><label for="hole">Hole</label><input id="hole" placeholder="DDH-104" autocomplete="off"></div>
      <div class="ctl"><label for="boxn">Box number</label><input id="boxn" type="number" min="1" placeholder="12"></div></div>
    <div class="ctl"><label for="runs">Runs in this box, in metres</label><textarea id="runs" rows="2" placeholder="118.20-121.20, 121.20-124.20"></textarea><small>From and to of every run, in order, as written on the run blocks.</small></div>
    <details class="more"><summary>${I.chev}Tray settings</summary>
      <div class="row2"><div class="ctl"><label for="len">Tray length, cm</label><input id="len" type="number" min="10" max="300" step="0.1" value="100"></div>
        <div class="ctl"><label for="tray">Tray in the photo</label><input id="tray" type="number" min="1" max="4" value="1"><small>1 is the top tray.</small></div></div>
      <label class="toggle"><input type="checkbox" id="first" checked>The first run starts in this box</label></details>
    ${error ? `<p class="form-err" role="alert">${esc(error)}</p>` : ""}
    <div class="m-actions"><button class="btn" type="button" id="n-cancel">Cancel</button><button class="btn primary" type="submit" id="go">Log this box</button></div></form>`;
  if (vals) Object.entries(vals).forEach(([k, v]) => ($(k).value = v));
  const drop = $("drop");
  $("photo").onchange = (e) => { photo = e.target.files[0] || null; openNew(); };
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); photo = e.dataTransfer.files[0] || null; openNew(); };
  $("n-cancel").onclick = () => d.close();
  $("new-form").onsubmit = submitNew;
  if (!d.open) d.showModal();
}
async function submitNew(e) {
  e.preventDefault();
  const miss = [!photo && "the photo", !$("hole").value.trim() && "the hole", !$("boxn").value && "the box number", !$("runs").value.trim() && "the runs"].filter(Boolean);
  if (miss.length) return openNew(`Add ${miss.join(", ")}.`);
  const f = new FormData();
  f.append("photo", photo); f.append("hole_id", $("hole").value.trim()); f.append("box_number", $("boxn").value); f.append("runs", $("runs").value);
  f.append("box_length_cm", $("len").value || "100"); f.append("tray", $("tray").value || "1"); f.append("first_starts_in_box", $("first").checked ? "true" : "false");
  $("go").disabled = true; $("go").textContent = "Uploading";
  try { const box = await api("/api/boxes", {method:"POST", body:f}); photo = null; $("new-dialog").close(); location.hash = `#/box/${box.id}`; loadLists(); }
  catch (err) { openNew(err.message); }
}

addEventListener("resize", placeThumb);
loadLists().then(route);
